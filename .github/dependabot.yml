# Revisa cada semana si hay versiones nuevas (sobre todo parches de seguridad)
# y abre un Pull Request. Los PR no se publican: solo main despliega.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
