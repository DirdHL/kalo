<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Selecciona tu local Kalo para acceder al punto de venta y al inventario.">
    <meta name="theme-color" content="#cdd5ce">
    <title>Kalo | Elige tu local</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="./kalo-logo.png">
    <link rel="stylesheet" href="./landing.css">
</head>
<body>
    <div class="landing-shell">
        <header class="landing-header">
            <div class="brand">
                <img src="./kalo-logo.png" alt="" width="42" height="46">
                <div>
                    <span class="brand-name">Kalo</span>
                    <span class="brand-description">Punto de venta</span>
                </div>
            </div>
            <span class="header-label">Ventas e inventario</span>
        </header>

        <main class="local-selection">
            <div class="welcome-copy">
                <p class="eyebrow">TU ESPACIO DE TRABAJO</p>
                <h1>¿En qué local estás hoy?</h1>
                <p class="welcome-description">Selecciona tu sucursal para iniciar sesión.</p>
            </div>

            <nav class="local-grid" aria-label="Locales disponibles">
                <a href="./brisas.html" class="local-card">
                    <span class="local-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18l-2-6H5l-2 6Z"/><path d="M4 10v10h16V10M9 20v-6h6v6M3 10a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/></svg>
                    </span>
                    <span class="local-name">Las Brisas</span>
                    <span class="local-action">Ingresar al local <span aria-hidden="true">↗</span></span>
                </a>
                <a href="./pinos.html" class="local-card">
                    <span class="local-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18l-2-6H5l-2 6Z"/><path d="M4 10v10h16V10M9 20v-6h6v6M3 10a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/></svg>
                    </span>
                    <span class="local-name">Los Pinos</span>
                    <span class="local-action">Ingresar al local <span aria-hidden="true">↗</span></span>
                </a>
                <a href="./polideportivo.html" class="local-card">
                    <span class="local-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18l-2-6H5l-2 6Z"/><path d="M4 10v10h16V10M9 20v-6h6v6M3 10a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/></svg>
                    </span>
                    <span class="local-name">El Polideportivo</span>
                    <span class="local-action">Ingresar al local <span aria-hidden="true">↗</span></span>
                </a>




                
            </nav>

        </main>
 
        <footer class="landing-footer">Kalo <span aria-hidden="true">·</span> Todo listo para tu jornada.</footer>
    </div>
</body>
</html>
